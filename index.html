<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="21600">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard CD — Julio 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#0A1628;--card:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);--muted:#78909C;--sub:#90CAF9;--green:#69F0AE;--hh:60px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;color:#fff;min-height:100vh;overflow-x:hidden}
.hdr{background:linear-gradient(135deg,#1F3864,#2E75B6);padding:0 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #2E75B6;height:var(--hh);position:sticky;top:0;z-index:50}
.logo-wrap{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.dib-logo{height:40px;width:auto;object-fit:contain;flex-shrink:0}
.hdr-title{font-size:11px;font-weight:800;color:#fff;letter-spacing:0.5px;text-transform:uppercase;line-height:1.25;max-width:200px}
.hdr-r{text-align:right;flex-shrink:0;min-width:110px}
.hdr-r{text-align:right}
.hdr-mes{font-size:14px;font-weight:700;color:#64B5F6}
.hdr-sub{font-size:10px;color:#90CAF9;margin-top:1px}
.hdr-prom{font-size:11px;color:#A5D6A7;font-weight:600}
.slide{display:none;width:100%;animation:fi 0.4s ease}.slide.active{display:block}
@keyframes fi{from{opacity:0}to{opacity:1}}
.layout{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"p k" "p c" "p g";gap:8px;padding:10px;height:calc(100vh - var(--hh))}
.p{grid-area:p;display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px}
.av{width:200px;height:200px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;border:3px solid rgba(255,255,255,0.2);box-shadow:0 4px 24px rgba(0,0,0,0.5);overflow:hidden;background-size:cover;background-position:center top;flex-shrink:0}
.nm{font-size:15px;font-weight:800;text-align:center;line-height:1.2}
.bdg{background:linear-gradient(135deg,#FFD700,#FFA000);color:#111;font-size:11px;font-weight:900;padding:3px 14px;border-radius:20px;white-space:nowrap}
.inc{background:linear-gradient(135deg,#1B5E20,#2E7D32);border-radius:10px;padding:10px;text-align:center;width:100%;border:1px solid rgba(76,175,80,0.4)}
.il{font-size:8px;color:#A5D6A7;letter-spacing:2px;font-weight:700}
.iv{font-size:24px;font-weight:900;color:var(--green);line-height:1.1}
.is{font-size:9px;color:#81C784}
.bc{width:100%}.bl{font-size:9px;color:var(--sub);margin-bottom:2px;display:flex;justify-content:space-between}
.bb{background:rgba(255,255,255,0.1);border-radius:4px;height:7px;overflow:hidden}.bf{height:100%;border-radius:4px}
.k{grid-area:k;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.kc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 8px;text-align:center;height:72px;display:flex;flex-direction:column;justify-content:center}
.kl{font-size:8px;color:var(--sub);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.kv{font-size:20px;font-weight:900;line-height:1}
.ks{font-size:9px;color:var(--muted);margin-top:2px}
.c{grid-area:c;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.g{grid-area:g;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;min-height:0}
.cw{position:relative;flex:1;min-height:160px}
.st{font-size:9px;font-weight:700;letter-spacing:2px;color:#64B5F6;text-transform:uppercase;border-bottom:1px solid rgba(100,181,246,0.3);padding-bottom:4px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.stot{font-size:10px;font-weight:400;color:var(--sub);letter-spacing:0}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gc{border-radius:6px;padding:5px 8px;border-left:2px solid;background:rgba(255,255,255,0.03)}
.gn{font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.gr{display:flex;justify-content:space-between;align-items:baseline}
.gv{font-size:12px;font-weight:800}.gu{font-size:8px;color:var(--sub)}
.ga{font-size:8px;color:#546E7A;margin-top:1px}
.avance-box{width:100%;background:rgba(100,181,246,0.08);border:1px solid rgba(100,181,246,0.2);border-radius:8px;padding:8px 10px}
.av-title{font-size:8px;font-weight:700;letter-spacing:2px;color:#64B5F6;text-transform:uppercase;margin-bottom:4px}
.av-nums{display:flex;align-items:baseline;gap:4px;margin-bottom:3px}
.av-past{font-size:16px;font-weight:900;color:#64B5F6}
.av-sep{font-size:12px;color:#546E7A}
.av-total{font-size:11px;color:#546E7A}
.av-rest{font-size:9px;color:#A5D6A7;margin-top:5px;text-align:center}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:4px}
.tc{border-radius:6px;padding:5px 8px;border-left:2px solid;background:rgba(255,255,255,0.03)}
.tn{font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.tv{font-size:12px;font-weight:800}.ta{font-size:8px;color:#546E7A;margin-top:1px}
.dots{display:flex;justify-content:center;gap:7px;padding:8px 0}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.25);cursor:pointer;transition:all 0.3s}
.dot.active{background:#64B5F6;transform:scale(1.4)}
.pb{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#2E75B6,#64B5F6);animation:pg 14s linear infinite;z-index:100}
@keyframes pg{from{width:0}to{width:100%}}
.ts{position:fixed;top:4px;right:12px;font-size:9px;color:#37474F;z-index:51}
@media(max-width:640px){
  :root{--hh:64px}
  .hdr-title{font-size:10px;max-width:140px}.hdr-mes{font-size:11px}.hdr-sub,.hdr-prom{font-size:9px}.dib-logo{height:32px}
  .layout{grid-template-columns:1fr;grid-template-areas:"p" "k" "c" "g";height:auto;padding:8px;gap:8px}
  .av{width:80px;height:80px;font-size:28px}.nm{font-size:13px}
  .kv{font-size:20px}.gg{grid-template-columns:repeat(2,1fr)}.cw{height:140px}
}
</style>
</head>

const charts={};

function fmt(n){return '$'+Number(n).toLocaleString('es-CL',{maximumFractionDigits:0})}
function bc(cid,op){
  if(charts[cid]){charts[cid].destroy();delete charts[cid]}
  const el=document.getElementById(cid);
  if(!el||!op.dias_vals?.length)return;
  charts[cid]=new Chart(el,{type:'bar',data:{labels:op.dias_labels,datasets:[
    {type:'bar',label:'Diario',data:op.dias_vals,backgroundColor:op.color+'88',borderColor:op.color,borderWidth:1,borderRadius:3,yAxisID:'y'},
    {type:'line',label:'Acumulado',data:op.dias_acum,borderColor:'#69F0AE',backgroundColor:'transparent',borderWidth:2,pointRadius:2,tension:0.3,yAxisID:'y2'}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:400},

    scales:{

      y:{position:'left',ticks:{color:op.color,font:{size:8},callback:v=>'$'+(v/1000).toFixed(0)+'k'},grid:{color:'rgba(255,255,255,0.04)'}},
      y2:{position:'right',ticks:{color:'#69F0AE',font:{size:8},callback:v=>'$'+(v/1000).toFixed(0)+'k'},grid:{drawOnChartArea:false}}
    }

    });
    s.innerHTML=`
<div class="layout">

function go(i){
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  cur=i;document.getElementById('s'+cur).classList.add('active');
  document.querySelectorAll('.dot')[cur].classList.add('active');
  const pb=document.getElementById('pb');pb.style.animation='none';pb.offsetHeight;pb.style.animation='';
  setTimeout(()=>bc('c'+cur,DATA[cur]),50);
}
function next(){go((cur+1)%DATA.length)}

document.getElementById('slides').addEventListener('mouseenter',()=>clearInterval(tmr));

document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')go((cur-1+DATA.length)%DATA.length)});
</script>
